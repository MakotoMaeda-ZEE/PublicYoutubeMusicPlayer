<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>YouTube Music Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101218;color:#f4f4f4;font:16px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:22px}section{background:#1b1e26;border:1px solid #363b48;border-radius:14px;padding:18px;margin:16px 0}button,input,textarea,select{font:inherit;color:inherit;background:#292e39;border:1px solid #515969;border-radius:7px;padding:8px}button{cursor:pointer}button:hover{background:#414958}textarea{width:100%;min-height:80px}button.primary{background:#c72647}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.screen{background:#000;min-height:220px;aspect-ratio:16/9;display:grid;place-items:center}.screen iframe{width:100%;height:100%;min-height:220px;border:0}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}ul{padding:0;list-style:none;max-height:480px;overflow:auto}li{display:flex;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #454b59}li.active{background:#512033}li img{width:64px;height:36px;object-fit:cover}.track{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}.small{font-size:13px}#status{padding:10px;border:1px solid #c96e29;display:none}#filter{width:100%}label{cursor:pointer}a{color:#9ccaff} @media(max-width:800px){.layout{display:block}main{padding:12px}}
</style><main><h1>YouTube Music Player</h1><p id="status" role="status"></p><div class="layout"><section><div id="screen" class="screen"></div><h2 id="now"></h2><div id="watch"></div><div class="row"><button id="all" class="primary"></button><button id="stop"></button></div><div class="row"><label><input id="cont" type="checkbox"><span id="contLabel"></span></label><label><input id="shuffle" type="checkbox"><span id="shuffleLabel"></span></label><label><input id="repeat" type="checkbox"><span id="repeatLabel"></span></label></div><p id="note" class="small"></p></section><section><textarea id="input"></textarea><div class="row"><button id="add" class="primary"></button><button id="clear"></button><span id="count"></span></div><input id="filter" type="search"><ul id="queue"></ul><div class="row"><select id="lists"></select><button id="save"></button><button id="load"></button><button id="delete"></button></div></section></div></main>
<script>
'use strict';
const HOST='https://www.youtube.com';
const $=s=>document.getElementById(s), K={q:'ytmp.embed.queue',l:'ytmp.embed.lists',p:'ytmp.embed.prefs'};
const text={all:'\u5168\u66f2\u3092\u518d\u751f',stop:'\u505c\u6b62',contLabel:'\u9023\u7d9a\u518d\u751f',shuffleLabel:'\u30b7\u30e3\u30c3\u30d5\u30eb',repeatLabel:'\u30ea\u30d4\u30fc\u30c8',add:'\u8ffd\u52a0',clear:'\u5168\u524a\u9664',save:'\u4fdd\u5b58',load:'\u8aad\u307f\u8fbc\u307f',delete:'\u524a\u9664',note:'\u901a\u5e38\u306e youtube.com \u57cb\u3081\u8fbc\u307f\u7248\uff08API\u4e0d\u4f7f\u7528\uff09\u3002\u518d\u751f\u64cd\u4f5c\u306f\u52d5\u753b\u5185\u3067\u884c\u3044\u307e\u3059\u3002\u30aa\u30d7\u30b7\u30e7\u30f3\u306f\u6b21\u306e\u66f2\u9078\u629e\u304b\u3089\u53cd\u6620\u3002\u8868\u793a\u306f\u518d\u751f\u958b\u59cb\u3057\u305f\u66f2\u306e\u307e\u307e\u3067\u3059\u3002'};
for(const [id,t] of Object.entries(text))$(id).textContent=t;
$('input').placeholder='YouTube URL / \u52d5\u753bID\uff08\u6539\u884c\u533a\u5207\u308a\uff09';$('filter').placeholder='\u30ad\u30e5\u30fc\u5185\u3092\u7d5e\u308a\u8fbc\u307f';
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function message(t){$('status').textContent=t;$('status').style.display='block'}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{message('\u4fdd\u5b58\u3067\u304d\u307e\u305b\u3093\u3002\u30d6\u30e9\u30a6\u30b6\u306e\u30b5\u30a4\u30c8\u30c7\u30fc\u30bf\u8a2d\u5b9a\u3092\u78ba\u8a8d\u3057\u3066\u304f\u3060\u3055\u3044\u3002')}}
let queue=read(K.q,[]),lists=read(K.l,{}),prefs=read(K.p,{cont:true,shuffle:false,repeat:false}),current=null,drag=null;
const key=x=>x.kind+':'+x.id, title=x=>x.title||x.id;
function persist(){write(K.q,queue);write(K.p,prefs)}
function parse(s){s=s.trim();if(/^[\w-]{11}$/.test(s))return{kind:'video',id:s,title:''};try{const u=new URL(s),h=u.hostname;if(!['youtube.com','www.youtube.com','music.youtube.com','m.youtube.com','youtu.be','www.youtube-nocookie.com'].includes(h))return null;const id=h==='youtu.be'?u.pathname.slice(1).split('/')[0]:u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/)?.[1];if(id&&/^[\w-]{11}$/.test(id))return{kind:'video',id,title:''};const l=u.searchParams.get('list');if(l&&/^(PL|OLAK5uy_|UU|FL)[\w-]+$/.test(l))return{kind:'list',id:l,title:''}}catch{}return null}
function add(){let raw=$('input').value,items=[];const doc=new DOMParser().parseFromString(raw,'text/html');if(doc.querySelector('a[href]')){for(const a of doc.querySelectorAll('a[href]')){const x=parse(a.getAttribute('href'));if(x){x.title=a.textContent.trim();items.push(x)}}}else for(const line of raw.split(/\r?\n/)){const urls=line.match(/https?:\/\/[^\s<>"']+/g)||[line.trim()];for(const u of urls){const x=parse(u);if(x){if(urls.length===1)x.title=line.replace(u,'').trim();items.push(x)}}}let n=0;for(const x of items){const old=queue.find(y=>key(y)===key(x));if(!old){queue.push(x);n++}else if(!old.title&&x.title)old.title=x.title}persist();render();$('input').value='';message(n+'\u4ef6\u3092\u8ffd\u52a0')}
function srcFor(it){const p=new URLSearchParams({autoplay:'1',rel:'0',playsinline:'1'});if(it.kind==='list'){p.set('listType','playlist');p.set('list',it.id);if(prefs.repeat)p.set('loop','1');return HOST+'/embed?'+p}let rest=[];const vids=queue.filter(x=>x.kind==='video');if(prefs.cont){const i=vids.indexOf(it);rest=vids.slice(i+1);if(prefs.repeat)rest=rest.concat(vids.slice(0,i));if(prefs.shuffle){rest=vids.filter(x=>x!==it);for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}}}let ids=rest.slice(0,99).map(x=>x.id);if(prefs.repeat){p.set('loop','1');if(!ids.length)ids=[it.id]}if(ids.length)p.set('playlist',ids.join(','));return HOST+'/embed/'+it.id+'?'+p}
function play(it){current=it;const f=document.createElement('iframe');f.title='YouTube video player';f.referrerPolicy='strict-origin-when-cross-origin';f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.allowFullscreen=true;f.src=srcFor(it);$('screen').replaceChildren(f);$('now').textContent=title(it);const a=document.createElement('a');a.textContent='YouTube\u3067\u958b\u304f';a.href=it.kind==='list'?'https://www.youtube.com/playlist?list='+it.id:'https://www.youtube.com/watch?v='+it.id;a.target='_blank';a.rel='noopener noreferrer';$('watch').replaceChildren(a);render()}
function stop(){$('screen').replaceChildren();$('now').textContent='';$('watch').replaceChildren();current=null;render()}
function render(){$('queue').replaceChildren();$('count').textContent=queue.length+'\u4ef6';const q=$('filter').value.toLowerCase();for(const it of queue){if(!(title(it)+' '+it.id).toLowerCase().includes(q))continue;const li=document.createElement('li');li.className=current===it?'active':'';li.draggable=!q;if(it.kind==='video'){const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+it.id+'/mqdefault.jpg';img.alt='';img.loading='lazy';li.append(img)}const b=document.createElement('button');b.className='track';b.textContent=title(it);b.onclick=()=>play(it);const edit=document.createElement('button');edit.textContent='\u270e';edit.title='\u30bf\u30a4\u30c8\u30eb\u7de8\u96c6';edit.onclick=()=>{const t=prompt(edit.title,it.title);if(t!==null){it.title=t.trim();persist();render();if(current===it)$('now').textContent=title(it)}};const del=document.createElement('button');del.textContent='\u00d7';del.title='\u524a\u9664';del.onclick=()=>{queue=queue.filter(x=>x!==it);if(current===it)stop();persist();render()};li.append(b,edit,del);li.ondragstart=e=>{drag=it;e.dataTransfer.setData('text/plain',key(it))};li.ondragover=e=>e.preventDefault();li.ondrop=e=>{e.preventDefault();if(!drag||drag===it)return;queue.splice(queue.indexOf(drag),1);queue.splice(queue.indexOf(it),0,drag);drag=null;persist();render()};li.ondragend=()=>drag=null;$('queue').append(li)}}
function renderLists(){$('lists').replaceChildren();for(const name of Object.keys(lists)){const o=document.createElement('option');o.value=name;o.textContent=name;$('lists').append(o)}}
$('add').onclick=add;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();add()}};$('filter').oninput=render;
for(const k of ['cont','shuffle','repeat']){$(k).checked=!!prefs[k];$(k).onchange=()=>{prefs[k]=$(k).checked;persist()}}
$('all').onclick=()=>{if(!queue.length)return;const pool=queue.filter(x=>x.kind==='video');const a=pool.length?pool:queue;play(a[prefs.shuffle?Math.floor(Math.random()*a.length):0])};$('stop').onclick=stop;
$('clear').onclick=()=>{if(confirm('\u30ad\u30e5\u30fc\u3092\u5168\u524a\u9664\u3057\u307e\u3059\u304b\uff1f')){queue=[];stop();persist()}};
$('save').onclick=()=>{if(!queue.length)return;const n=prompt('\u30d7\u30ec\u30a4\u30ea\u30b9\u30c8\u540d');if(!n?.trim())return;Object.defineProperty(lists,n.trim(),{value:queue.map(x=>({...x})),enumerable:true,configurable:true,writable:true});write(K.l,lists);renderLists();$('lists').value=n.trim()};
$('load').onclick=()=>{const a=lists[$('lists').value];if(!Array.isArray(a))return;queue=a.map(x=>({...x}));stop();persist()};$('delete').onclick=()=>{const n=$('lists').value;if(n&&confirm('\u524a\u9664\u3057\u307e\u3059\u304b\uff1f')){delete lists[n];write(K.l,lists);renderLists()}};
render();renderLists();if(location.protocol==='file:')message('HTTP(S)\u7d4c\u7531\u3067\u958b\u3044\u3066\u304f\u3060\u3055\u3044\u3002');
</script></html>
